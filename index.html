<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Footyline — football forecasts with the receipts</title>
<meta name="description" content="Match probabilities for eleven leagues, built from five seasons of results, backtested against the closing market, and explained in full.">
<meta name="theme-color" content="#07100b">
<meta property="og:type" content="website">
<meta property="og:title" content="Footyline — football forecasts with the receipts">
<meta property="og:description" content="Match probabilities for eleven leagues, backtested against the closing market and explained in full.">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/assets/app.css">
<script>
  (function () {
    try {
      var query = new URLSearchParams(location.search).get("theme");
      var forced = query === "light" || query === "dark" ? query : null;
      var saved = localStorage.getItem("footyline:theme");
      var system = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = forced || saved || system;
    } catch (error) {
      document.documentElement.dataset.theme = "dark";
    }
  })();
</script>
</head>
<body>
<a class="skip-link" href="#app">Skip to content</a>
<noscript><p style="padding:24px;font-family:system-ui">Footyline needs JavaScript to render its forecasts.</p></noscript>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9L12 3Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></symbol>
  </defs>
</svg>

<div class="shell">
  <aside class="rail" aria-label="Primary">
    <a class="brand" href="/" data-link>
      <span class="brand__mark" aria-hidden="true">F</span>
      <span class="brand__word">footy<b>line</b></span>
      <span class="brand__beta">BETA</span>
    </a>

    <p class="rail__label">Workspace</p>
    <nav class="rail__nav" aria-label="Sections">
      <a class="nav-item" href="/" data-link data-nav="overview"><svg><use href="#i-grid"/></svg>Overview</a>
      <a class="nav-item" href="/matches" data-link data-nav="matches"><svg><use href="#i-calendar"/></svg>Match centre</a>
      <a class="nav-item" href="/model" data-link data-nav="model"><svg><use href="#i-chart"/></svg>The model</a>
      <a class="nav-item" href="/watchlist" data-link data-nav="watchlist"><svg><use href="#i-star"/></svg>Watchlist<kbd data-watch-count></kbd></a>
    </nav>

    <p class="rail__label">Competitions</p>
    <nav class="league-nav" id="leagueNav" aria-label="Competitions"></nav>

    <div class="rail__foot">
      <p class="rail__status"><span class="dot" id="statusDot"></span><span id="statusText">Loading feed</span></p>
      <p class="rail__meta" id="railMeta">—</p>
    </div>
  </aside>

  <main class="main" id="main">
    <header class="topbar">
      <a class="mobile-brand" href="/" data-link aria-label="Footyline home">
        <span class="brand__mark" aria-hidden="true">F</span>
        <span class="brand__word">footy<b>line</b></span>
      </a>
      <p class="topbar__crumb" id="crumb"><span>Overview</span></p>
      <div class="topbar__actions">
        <button class="search-trigger" type="button" id="searchOpen" aria-label="Search teams, fixtures and competitions">
          <svg width="15" height="15"><use href="#i-search"/></svg>
          <span>Search</span>
          <kbd>⌘K</kbd>
        </button>
        <span class="pill pill--live" id="asOf">—</span>
        <button class="icon-btn" type="button" id="themeToggle" aria-label="Switch colour theme"></button>
      </div>
    </header>

    <div id="app"></div>
    <p class="sr-only" role="status" aria-live="polite" id="announcer"></p>

    <footer class="footer">
      <p>Footyline · independent, open-data football forecasts. Not betting advice.</p>
      <div class="footer__links">
        <a href="/model" data-link>The method</a>
        <a href="https://www.football-data.co.uk/" target="_blank" rel="noopener">Results data</a>
        <a href="https://fixturedownload.com/" target="_blank" rel="noopener">Fixture calendar</a>
      </div>
    </footer>
  </main>
</div>

<nav class="mobile-nav" aria-label="Sections">
  <a href="/" data-link data-nav="overview"><svg><use href="#i-grid"/></svg>Overview</a>
  <a href="/matches" data-link data-nav="matches"><svg><use href="#i-calendar"/></svg>Matches</a>
  <a href="/model" data-link data-nav="model"><svg><use href="#i-chart"/></svg>Model</a>
  <a href="/watchlist" data-link data-nav="watchlist"><svg><use href="#i-star"/></svg>Saved</a>
</nav>

<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Search Footyline" hidden>
  <div class="palette__box">
    <div class="palette__field">
      <svg><use href="#i-search"/></svg>
      <input id="paletteInput" type="text" autocomplete="off" spellcheck="false" placeholder="Search teams, fixtures, competitions…" aria-label="Search" aria-controls="paletteList">
      <kbd>ESC</kbd>
    </div>
    <div class="palette__list" id="paletteList" role="listbox" aria-label="Results"></div>
  </div>
</div>

<script type="module" src="/assets/js/main.js"></script>
</body>
</html>
