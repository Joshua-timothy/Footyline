<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Footyline — every match, modelled</title>
<meta name="description" content="Probabilities for every fixture in eleven competitions, refreshed twice a day and graded in public against the closing market.">
<meta name="theme-color" content="#f1efe8">
<meta property="og:type" content="website">
<meta property="og:title" content="Footyline — every match, modelled">
<meta property="og:description" content="Probabilities for every fixture in eleven competitions, graded in public against the closing market.">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<meta name="application-name" content="Footyline">
<meta name="apple-mobile-web-app-title" content="Footyline">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/assets/app.css">
<script>
  (function () {
    try {
      var query = new URLSearchParams(location.search).get("theme");
      var forced = query === "light" || query === "dark" ? query : null;
      var saved = localStorage.getItem("footyline:theme");
      var system = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = forced || saved || system;
    } catch (error) {
      document.documentElement.dataset.theme = "light";
    }
  })();
</script>
</head>
<body>
<a class="skip-link" href="#app">Skip to content</a>
<noscript><p style="padding:24px;font-family:system-ui">Footyline needs JavaScript to render its forecasts.</p></noscript>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9L12 3Z"/></symbol>
  </defs>
</svg>

<header class="masthead">
  <a class="brand" href="/" data-link>footyline<sup>®</sup></a>
  <p class="crumb" id="crumb"><span>Overview</span></p>
  <nav class="mainnav" aria-label="Sections">
    <a class="navlink" href="/matches" data-link data-nav="matches">Fixtures</a>
    <button class="navlink" type="button" id="competitionsToggle" aria-expanded="false" aria-controls="competitionsPanel">Competitions</button>
    <a class="navlink" href="/model" data-link data-nav="model">Model</a>
    <a class="navlink" href="/watchlist" data-link data-nav="watchlist">Saved</a>
  </nav>
  <div class="tools">
    <button class="toolbtn" type="button" id="searchOpen" aria-label="Search">
      <svg><use href="#i-search"/></svg><span>Search</span><kbd>⌘K</kbd>
    </button>
    <span class="stamp" id="asOf">—</span>
    <button class="toolbtn toolbtn--icon" type="button" id="themeToggle" aria-label="Switch colour theme"></button>
  </div>
</header>

<div class="comppanel" id="competitionsPanel" aria-label="Competitions">
  <div class="comppanel__head">
    <span class="label">Eleven competitions</span>
    <a class="bandhead__link" href="/matches" data-link>All fixtures</a>
  </div>
  <nav class="comppanel__grid" id="leagueNav"></nav>
</div>

<main class="frame" id="main">
  <div id="app"></div>
  <p class="sr-only" role="status" aria-live="polite" id="announcer"></p>

  <footer class="foot">
    <span>Footyline · independent, open-data forecasts. Not betting advice.</span>
    <span>
      <a href="/model" data-link>The method</a> ·
      <a href="https://www.football-data.co.uk/" target="_blank" rel="noopener">Results data</a> ·
      <a href="https://fixturedownload.com/" target="_blank" rel="noopener">Fixtures</a>
    </span>
  </footer>
</main>

<nav class="tabbar" aria-label="Sections">
  <a href="/" data-link data-nav="overview">Index</a>
  <a href="/matches" data-link data-nav="matches">Fixtures</a>
  <a href="/model" data-link data-nav="model">Model</a>
  <a href="/watchlist" data-link data-nav="watchlist">Saved</a>
</nav>

<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Search Footyline" hidden>
  <div class="palette__box">
    <div class="palette__field">
      <svg><use href="#i-search"/></svg>
      <input id="paletteInput" type="text" autocomplete="off" spellcheck="false" placeholder="Search clubs, fixtures, competitions…" aria-label="Search">
      <kbd>ESC</kbd>
    </div>
    <div class="palette__list" id="paletteList" role="listbox" aria-label="Results"></div>
  </div>
</div>

<script type="module" src="/assets/js/main.js"></script>
</body>
</html>
