name: Forecast refresh

# Twice a day, plus a fuller audit once a week.
#   - 06:10 UTC catches everything played overnight
#   - 23:30 UTC catches same-evening results
#   - Monday 05:15 UTC re-runs the walk-forward backtest that powers /model
#
# Nothing here needs a season string: the pipeline derives the live season from
# the calendar, so 1 July rolls the whole system over without an edit.

on:
  schedule:
    - cron: "10 6 * * *"
    - cron: "30 23 * * *"
    - cron: "15 5 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: Build mode
        type: choice
        options: [daily, weekly]
        default: daily
      force:
        description: Re-download every source file
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: forecast-refresh
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: "utf-8"
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Resolve mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
            FORCE="${{ inputs.force }}"
          elif [ "${{ github.event.schedule }}" = "15 5 * * 1" ]; then
            MODE=weekly
            FORCE=true
          else
            MODE=daily
            FORCE=false
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "force=$FORCE" >> "$GITHUB_OUTPUT"
          echo "Running mode=$MODE force=$FORCE"

      - name: Season self-check
        working-directory: pipeline
        run: python seasons.py

      - name: Refresh sources
        working-directory: pipeline
        run: |
          if [ "${{ steps.mode.outputs.force }}" = "true" ]; then
            python fetch.py --force
          else
            python fetch.py
          fi

      - name: Build feed
        working-directory: pipeline
        run: python build.py --mode "${{ steps.mode.outputs.mode }}"

      - name: Verify artifacts
        working-directory: pipeline
        run: python check.py --max-age-hours 6

      - name: Write job summary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          meta = json.loads(Path("data/meta.json").read_text())
          metrics = json.loads(Path("data/metrics.json").read_text())
          live = metrics.get("live") or {}
          summary = metrics.get("summary") or {}
          lines = [
              f"### Forecast refresh — {meta.get('mode')}",
              "",
              f"- Live season: **{meta.get('seasonLabel')}** (`{meta.get('liveSeason')}`)",
              f"- Fixtures published: **{meta.get('fixtures'):,}** across {meta.get('leagues')} competitions",
              f"- Results data to: **{meta.get('dataAsOf')}**",
              f"- Model version: `{meta.get('modelVersion')}`",
              f"- Feed: {meta.get('feedBytes', 0) / 1024:.0f} KB, sha1 `{meta.get('feedSha1')}`",
              "",
              f"Backtest: {summary.get('matches', 0):,} matches, Brier **{summary.get('brier')}** "
              f"(market {summary.get('marketBrier')})",
          ]
          if live.get("settled"):
              lines.append(
                  f"Live record: {live['settled']} settled, Brier **{live.get('brier')}**, "
                  f"accuracy {live.get('accuracy')}%"
              )
          else:
              lines.append("Live record: no settlements yet")
          if meta.get("fetchWarnings"):
              lines.append("")
              lines.append("**Fetch warnings**")
              lines.extend(f"- {item}" for item in meta["fetchWarnings"])
          text = "\n".join(lines)
          print(text)
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(text + "\n")
          PY

      - name: Commit ledger and data
        id: commit
        run: |
          git config user.name "footyline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ledger.jsonl data/meta.json

          # With a Vercel token the site is deployed from the workspace, so the
          # large artifacts stay out of git history. Without one, committing them
          # lets any git-connected host deploy on push.
          if [ -z "$VERCEL_TOKEN" ]; then
            git add data/feed.json data/metrics.json
          fi

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit"
          else
            git commit -m "chore: refresh forecasts $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Vercel
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

      - name: Note the no-token path
        if: ${{ env.VERCEL_TOKEN == '' }}
        run: |
          echo "::notice::VERCEL_TOKEN is not set — data/feed.json was committed, so a git-connected host will deploy on push."

